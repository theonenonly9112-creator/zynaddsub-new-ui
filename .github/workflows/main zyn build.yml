                  g_env->end();
              }

              VirKeys *kb = new VirKeys(PAD, kb_y, WIN_W - 2 * PAD, KB_H, "Keyboard");
              kb->box(FL_BORDER_BOX);
              kb->color(17);
              kb->init(ui->osc, "/");

              win->end();

              const int nx = PAD + 390 + PAD;

              if(big) {
                  // ENGINES: engine selector row; the editors appear below it
                  static const char *engnames[3] = {"ADD SYNTH", "SUB SYNTH", "PAD SYNTH"};
                  g_pages[0]->begin();
                  for(int i = 0; i < 3; ++i) {
                      Fl_Button *b = new Fl_Button(PAD + i * 158, page_y + 2, 118, SEL_H, engnames[i]);
                      b->type(FL_RADIO_BUTTON);
                      b->box(FL_FLAT_BOX);
                      b->down_box(FL_FLAT_BOX);
                      b->color(fl_rgb_color(22, 30, 40));
                      b->selection_color(fl_rgb_color(0, 128, 76));
                      b->labelcolor(fl_rgb_color(215, 240, 230));
                      b->labelfont(FL_HELVETICA_BOLD);
                      b->labelsize(14);
                      b->clear_visible_focus();
                      b->callback(eng_cb, (void *)(intptr_t)i);
                      g_engbtn[i] = b;

                      Fl_Check_Button *on = new Fl_Check_Button(PAD + i * 158 + 122, page_y + 2, 30, SEL_H);
                      on->box(FL_FLAT_BOX);
                      on->color(fl_rgb_color(22, 30, 40));
                      on->selection_color(fl_rgb_color(0, 200, 110));
                      on->tooltip("Engine on / off");
                      on->clear_visible_focus();
                      on->callback(engon_cb, (void *)(intptr_t)i);
                      g_engon[i] = on;
                  }
                  Fl_Button *ib = new Fl_Button(WIN_W - PAD - 190, page_y + 2, 190, SEL_H,
                                                "Instrument info / Part FX");
                  ib->box(FL_FLAT_BOX);
                  ib->color(fl_rgb_color(22, 30, 40));
                  ib->labelcolor(fl_rgb_color(215, 240, 230));
                  ib->labelsize(12);
                  ib->clear_visible_focus();
                  ib->callback(instr_cb);
                  g_pages[0]->end();
                  note(g_pages[0], PAD, g_engine_y, WIN_W - 2 * PAD, 200,
                       "ENGINES\n\nPress ADD SYNTH, SUB SYNTH or PAD SYNTH to open that editor inside this window.\n"
                       "An engine that is off is switched on automatically. The tick next to each name turns it on or off.");
                  // GLOBAL: part panel next to the master controls, controllers panel right of it
                  move_into(g_pages[3], ui->partuigroup, nx, page_y + PAD);
                  g_ctl_x = nx + 390 + PAD;
                  g_ctl_y = page_y + PAD;
              } else {
                  // small screen: part panel (with its Edit instrument button) stays on ENGINES
                  g_ctl_x = nx;
                  g_ctl_y = page_y + PAD;
                  move_into(g_pages[0], ui->partuigroup, PAD, page_y + PAD);
                  note(g_pages[0], nx, page_y + PAD, WIN_W - nx - PAD, 205,
                       "ENGINES\n\nClick 'Edit instrument' to open the ADD / SUB / PAD editors.\n"
                       "Your screen is too small to hold them inside this window,\n"
                       "so they open as separate windows.");
              }

              // FX page: system / insertion effects on the left, the part's 3 insert effects on the right
              if(fxtabs)
                  move_into(g_pages[1], fxtabs, PAD, page_y + PAD);
              g_fxp_x = nx;
              g_fxp_y = page_y + PAD;
              if(!big)
                  note(g_pages[2], PAD, page_y + PAD, WIN_W - 2 * PAD, 120,
                       "MATRIX\n\nKit edit and the ADD voice list open as separate windows on small screens\n"
