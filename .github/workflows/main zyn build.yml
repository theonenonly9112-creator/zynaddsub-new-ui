          class EnginePage : public Fl_Group
          {
          public:
              EnginePage(int x, int y, int w, int h) : Fl_Group(x, y, w, h) {}
              ~EnginePage()
              {
                  zyn_trace("EnginePage dtor: begin");
                  Fl::remove_timeout(env_tick);
                  g_graph = 0;
                  g_engine = 0;
                  g_matrix = 0;
                  g_global = 0;
                  g_fx = 0;
                  g_ui = 0;
