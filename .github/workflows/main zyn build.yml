              EnvStrip(int x, int y, int w, int h) : Fl_Group(x, y, w, h) {}
              ~EnvStrip()
              {
                  zyn_trace("EnvStrip dtor");
                  g_env = 0;
                  for(int i = children() - 1; i >= 0; --i) {
                      Fl_Window *c = dynamic_cast<Fl_Window *>(child(i));
                      if(c) {
