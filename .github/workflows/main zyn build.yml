          double val(Fl_Valuator *v)
          {
              return v ? v->value() : 0.0;
          }

          int env_category(const char *loc)
          {
              const std::string s(loc ? loc : "");
              if(s.find("FM") != std::string::npos)
                  return 3;                                   // modulator envelopes
              if(s.find("Filter") != std::string::npos)
                  return 2;
              if(s.find("Freq") != std::string::npos || s.find("BandWidth") != std::string::npos)
                  return 1;
              return 0;                                       // amplitude
          }

          // draws the envelope of the selected section straight from its knobs (no free mode needed)
          class EnvGraph : public Fl_Widget
          {
          public:
              EnvGraph(int x, int y, int w, int h) : Fl_Widget(x, y, w, h) {}
              void draw()
              {
                  fl_push_clip(x(), y(), w(), h());
                  fl_color(fl_rgb_color(8, 12, 16));
                  fl_rectf(x(), y(), w(), h());
                  fl_color(fl_rgb_color(26, 36, 46));
                  for(int i = 1; i < 8; ++i)
                      fl_line(x() + w() * i / 8, y(), x() + w() * i / 8, y() + h() - 1);
                  for(int i = 1; i < 4; ++i)
                      fl_line(x(), y() + h() * i / 4, x() + w() - 1, y() + h() * i / 4);
                  const EnvSrc &s = g_src[g_cur];
                  fl_font(FL_HELVETICA, 12);
                  if(!s.key) {
                      fl_color(fl_rgb_color(143, 167, 176));
                      fl_draw("Press E on an envelope of this kind to see it here", x() + 12, y() + 22);
                      fl_pop_clip();
                      return;
                  }
                  double X[6], Y[6];
                  int n = 0;
                  const double hold = 0.18;
                  const double A = 0.05 + 0.20 * val(s.v[1]) / 127.0;
                  const double D = 0.05 + 0.20 * val(s.v[3]) / 127.0;
                  const double R = 0.05 + 0.20 * val(s.v[6]) / 127.0;
                  if(s.mode == 1 || s.mode == 2) {            // amplitude: A D S R
                      const double sus = val(s.v[4]) / 127.0;
                      X[0] = 0;            Y[0] = 0;
                      X[1] = A;            Y[1] = 1;
                      X[2] = A + D;        Y[2] = sus;
                      X[3] = X[2] + hold;  Y[3] = sus;
                      X[4] = X[3] + R;     Y[4] = 0;
                      n = 5;
                  } else if(s.mode == 4) {                    // filter
                      X[0] = 0;            Y[0] = val(s.v[0]) / 127.0;
                      X[1] = A;            Y[1] = val(s.v[2]) / 127.0;
                      X[2] = A + D;        Y[2] = 0.5;
                      X[3] = X[2] + hold;  Y[3] = 0.5;
                      X[4] = X[3] + R;     Y[4] = val(s.v[5]) / 127.0;
                      n = 5;
                  } else {                                    // frequency and bandwidth
                      X[0] = 0;            Y[0] = val(s.v[0]) / 127.0;
                      X[1] = A;            Y[1] = 0.5;
                      X[2] = A + hold;     Y[2] = 0.5;
                      X[3] = X[2] + R;     Y[3] = val(s.v[5]) / 127.0;
                      n = 4;
                  }
                  const double total = X[n - 1] > 0 ? X[n - 1] : 1;
                  int px[6], py[6];
                  const int bottom = y() + h() - 10;
                  for(int i = 0; i < n; ++i) {
                      px[i] = x() + 10 + (int)((w() - 20) * X[i] / total);
                      py[i] = bottom - (int)((h() - 24) * Y[i]);
                  }
                  fl_color(fl_rgb_color(6, 56, 34));
                  for(int i = 0; i + 1 < n; ++i)
                      fl_polygon(px[i], py[i], px[i + 1], py[i + 1], px[i + 1], bottom, px[i], bottom);
                  fl_color(fl_rgb_color(0, 215, 120));
                  fl_line_style(FL_SOLID, 2);
                  for(int i = 0; i + 1 < n; ++i)
                      fl_line(px[i], py[i], px[i + 1], py[i + 1]);
                  fl_line_style(0);
                  for(int i = 0; i < n; ++i)
                      fl_rectf(px[i] - 2, py[i] - 2, 5, 5);
                  fl_color(fl_rgb_color(143, 167, 176));
                  fl_font(FL_HELVETICA, 10);
                  fl_draw(s.loc.c_str(), x() + 8, y() + 12);
                  fl_pop_clip();
              }
          };

          void env_tick(void *)
          {
              if(g_graph && g_graph->visible_r())
                  g_graph->redraw();
              Fl::repeat_timeout(0.1, env_tick);
          }

          void show_page(int n);
          void prepare_matrix();

          // show the last envelope opened for tab c (0 amplitude, 1 frequency, 2 filter, 3 modulation)
          void show_env_category(int c)
          {
              if(!g_env)
                  return;
              g_cur = c;
              if(g_graph)
                  g_graph->hide();
              for(int i = 0; i < 4; ++i)
                  if(g_envtab[i])
                      g_envtab[i]->value(i == c ? 1 : 0);
              Fl_Window *target = g_env_win[c];
              bool present = false;
              for(int i = 0; i < g_env->children(); ++i) {
                  Fl_Window *k = dynamic_cast<Fl_Window *>(g_env->child(i));
                  if(!k)
                      continue;
                  if(k == target)
                      present = true;
                  else
                      k->hide();
              }
              if(present)
                  target->show();
              else
                  g_env_win[c] = 0;
              g_env->redraw();
          }

          // show the live graph of the envelope chosen for tab c
          void show_graph(int c)
          {
              if(!g_env || !g_graph)
                  return;
              g_cur = c;
              for(int i = 0; i < 4; ++i)
                  if(g_envtab[i])
                      g_envtab[i]->value(i == c ? 1 : 0);
              for(int i = 0; i < g_env->children(); ++i) {
                  Fl_Window *k = dynamic_cast<Fl_Window *>(g_env->child(i));
                  if(k)
                      k->hide();
              }
              g_graph->show();
              g_graph->redraw();
          }

          void env_tab_cb(Fl_Widget *, void *d)
          {
              show_graph((int)(intptr_t)d);
          }

          // FREE MODE EDIT: open the point editor of the selected envelope (it is converted to free mode)
          void env_free_cb(Fl_Widget *, void *)
          {
              const EnvSrc &s = g_src[g_cur];
              if(s.key)
                  ((EnvelopeUI *)s.key)->open_as_freemode();
          }

          // ---- dark theme for the existing widgets (set ZYN_THEME=classic to turn it off) ----
          const Fl_Color C_TEXT()  { return fl_rgb_color(205, 228, 220); }
          const Fl_Color C_FIELD() { return fl_rgb_color(12, 16, 22); }

          bool fill_box(Fl_Boxtype b)
          {
              return b == FL_FLAT_BOX || b == FL_UP_BOX || b == FL_DOWN_BOX || b == FL_THIN_UP_BOX ||
                     b == FL_THIN_DOWN_BOX || b == FL_ENGRAVED_BOX || b == FL_EMBOSSED_BOX || b == FL_BORDER_BOX;
          }

          bool stock_gray(Fl_Color c)
          {
              return c >= 32 && c <= 55;   // FLTK gray ramp (includes the default background)
          }

          void themify(Fl_Widget *w, int depth)
          {
              if(!g_theme || !w)
                  return;
              Fl_Group *g = w->as_group();
              if(g) {
                  if(fill_box(w->box())) {
                      w->box(FL_FLAT_BOX);
                      w->color((depth & 1) ? fl_rgb_color(34, 44, 56) : fl_rgb_color(26, 34, 44));
                  }
                  w->labelcolor(C_TEXT());
                  for(int i = 0; i < g->children(); ++i)
                      themify(g->child(i), depth + 1);
                  return;
              }
              w->labelcolor(C_TEXT());
              if(Fl_Input_ *in = dynamic_cast<Fl_Input_ *>(w)) {
                  in->color(C_FIELD());
                  in->textcolor(C_TEXT());
                  in->cursor_color(C_TEXT());
              } else if(Fl_Menu_ *m = dynamic_cast<Fl_Menu_ *>(w)) {
                  m->color(C_FIELD());
                  m->textcolor(C_TEXT());
              } else if(Fl_Counter *c = dynamic_cast<Fl_Counter *>(w)) {
                  c->color(C_FIELD());
                  c->textcolor(C_TEXT());
              } else if(Fl_Value_Input *vi = dynamic_cast<Fl_Value_Input *>(w)) {
                  vi->color(C_FIELD());
                  vi->textcolor(C_TEXT());
              } else if(Fl_Value_Slider *vs = dynamic_cast<Fl_Value_Slider *>(w)) {
                  vs->textcolor(C_TEXT());
                  if(stock_gray(vs->color()))
                      vs->color(fl_rgb_color(50, 64, 80));
              } else if(Fl_Slider *sl = dynamic_cast<Fl_Slider *>(w)) {
                  if(stock_gray(sl->color()))
                      sl->color(fl_rgb_color(50, 64, 80));
              } else if(dynamic_cast<Fl_Button *>(w)) {
                  if(fill_box(w->box()) && stock_gray(w->color()))
                      w->color(fl_rgb_color(44, 58, 74));
              }
          }

          Fl_Widget *find_by_label(Fl_Widget *w, const char *label)
          {
              if(!w)
                  return 0;
              if(w->label() && !strcmp(w->label(), label))
                  return w;
              if(Fl_Group *g = w->as_group())
                  for(int i = 0; i < g->children(); ++i)
                      if(Fl_Widget *r = find_by_label(g->child(i), label))
                          return r;
              return 0;
          }

          // move a (top-level) editor window into a page as a child window
          void embed_into(Fl_Group *page, Fl_Window *w, int x, int y)
          {
              if(w->parent() != page) {
                  w->hide();
                  if(w->parent())
                      w->parent()->remove(w);
                  page->add(w);
                  themify(w, 0);
              }
              w->position(x, y);
              w->show();
          }

          void show_page(int n)
          {
              for(int i = 0; i < 5; ++i) {
                  if(g_pages[i]) {
                      if(i == n)
                          g_pages[i]->show();
                      else
                          g_pages[i]->hide();
                  }
                  if(g_tabs[i])
                      g_tabs[i]->value(i == n ? 1 : 0);
              }
              if(n == 4 && g_pages[4] && g_panelw) {
                  if(g_ui)
                      g_ui->updatepanel();
                  embed_into(g_pages[4], g_panelw, PAD, g_pages[4]->y() + PAD);
                  for(int i = 0; i < g_panelw->children(); ++i) {
                      Fl_Widget *c = g_panelw->child(i);
                      if(c->label() && !strcmp(c->label(), "Close"))
                          c->hide();
                  }
              }
              if(g_pages[n] && g_pages[n]->window())
                  g_pages[n]->window()->redraw();
          }

          void tab_cb(Fl_Widget *, void *d)
          {
              show_page((int)(intptr_t)d);
              if((int)(intptr_t)d == 2)
                  prepare_matrix();
          }

          // the "enabled" tick of an engine (ADD = 0, SUB = 1, PAD = 2) in the Instrument Edit panel
          Fl_Check_Button *engine_check(int engine)
          {
              if(!g_ui || !g_ui->partui)
                  return 0;
              PartUI *p = g_ui->partui;
              if(engine == 0)
                  return p->adsynenabledcheck;
              if(engine == 1)
                  return p->subsynenabledcheck;
              return p->padsynenabledcheck;
          }

          void open_later_cb(void *d)
          {
              if(g_ui && g_ui->partui)
                  g_ui->partui->showparameters(0, (int)(intptr_t)d);
          }

          // The backend only creates the SUB / PAD parameters when that engine is enabled.
          // Opening an editor for a disabled engine makes it talk to parameters that do
          // not exist (this crashed the PAD editor), so enable the engine first and open
          // the editor a moment later, once the backend has created the parameters.
          void eng_cb(Fl_Widget *, void *d)
          {
              const int engine = (int)(intptr_t)d;
              if(!g_ui || !g_ui->partui)
                  return;
              Fl_Check_Button *chk = engine_check(engine);
              if(chk && !chk->value()) {
                  chk->value(1);
                  chk->do_callback();
                  Fl::remove_timeout(open_later_cb, d);
                  Fl::add_timeout(0.5, open_later_cb, d);
                  return;
              }
              g_ui->partui->showparameters(0, engine);
          }

          // tick next to an engine name: switch the engine on or off
          void engon_cb(Fl_Widget *w, void *d)
          {
              Fl_Check_Button *chk = engine_check((int)(intptr_t)d);
              if(!chk)
                  return;
              chk->value(((Fl_Check_Button *)w)->value());
              chk->do_callback();
          }

          // keep our ticks in step with the real engine state
          void sync_cb(void *)
          {
              for(int i = 0; i < 3; ++i) {
                  Fl_Check_Button *chk = engine_check(i);
                  if(chk && g_engon[i] && g_engon[i]->value() != chk->value()) {
                      g_engon[i]->value(chk->value());
                      g_engon[i]->redraw();
                  }
              }
              Fl::repeat_timeout(0.3, sync_cb);
          }

          void instr_cb(Fl_Widget *, void *)
          {
              if(g_ui && g_ui->partui && g_ui->partui->instrumenteditwindow)
                  g_ui->partui->instrumenteditwindow->show();
          }

          Fl_Group *make_page(int y, int h, bool engine)
          {
              Fl_Group *g = engine ? new EnginePage(0, y, WIN_W, h) : new Fl_Group(0, y, WIN_W, h);
              g->box(FL_FLAT_BOX);
              g->color(fl_rgb_color(14, 18, 24));
              g->end();
              return g;
          }

          Fl_Box *note(Fl_Group *page, int x, int y, int w, int h, const char *text)
          {
              page->begin();
              Fl_Box *b = new Fl_Box(x, y, w, h, text);
              b->box(FL_FLAT_BOX);
              b->color(fl_rgb_color(22, 30, 40));
              b->labelcolor(fl_rgb_color(143, 167, 176));
              b->labelsize(12);
              b->align(FL_ALIGN_CENTER | FL_ALIGN_WRAP);
              page->end();
              return b;
          }

          void move_into(Fl_Group *page, Fl_Widget *w, int x, int y)
          {
              if(!w)
                  return;
              page->add(w);
              w->position(x, y);
          }

          void prepare_matrix()
          {
              if(!g_matrix || !g_ui || !g_ui->partui)
                  return;
              if(g_ui->partui->instrumentkitlist)
                  zyn_embed_matrix(g_ui->partui->instrumentkitlist, 0);   // kit edit
              g_ui->partui->showvoiceparams(0, true);                     // ADD voice list
          }

          } // namespace

          // kit list (slot 0) and ADD voice list (slot 1) live in the MATRIX tab
          void zyn_embed_matrix(Fl_Window *w, int slot)
          {
              if(!w)
                  return;
              if(!g_matrix) {            // small screen / classic layout: normal popup window
                  w->show();
                  return;
              }
              if(w->parent() != g_matrix) {
                  w->hide();
                  if(w->parent())
                      w->parent()->remove(w);
                  g_matrix->add(w);
              }
              themify(w, 0);
              // the Close buttons of the kit list and the voice list are not needed inside the tab
              for(int i = 0; i < w->children(); ++i) {
                  Fl_Widget *c = w->child(i);
                  if(c->label() && !strncmp(c->label(), "Close", 5))
                      c->hide();
              }
              w->position(slot == 1 ? PAD + 670 + PAD : PAD, g_matrix_y);
              w->show();
              show_page(2);
          }

          // Controllers window (portamento, pitch wheel ...) lives permanently in GLOBAL
          void zyn_embed_global(Fl_Window *w, int)
          {
              if(!w)
                  return;
              if(!g_global) {
                  w->show();
                  return;
              }
              embed_into(g_global, w, g_ctl_x, g_ctl_y);
              show_page(3);
          }

          // the part's three insert effects live in FX
          void zyn_embed_fx(Fl_Window *w)
          {
              if(!w)
                  return;
              if(!g_fx) {
                  w->show();
                  return;
              }
              embed_into(g_fx, w, g_fxp_x, g_fxp_y);
              show_page(1);
          }

          // Close buttons of embedded panels do nothing (the panel stays in its tab)
          void zyn_close_panel(Fl_Window *w)
          {
              if(w && !w->parent())
                  w->hide();
          }

          // "E" button of an envelope: the free-mode editor (graph) is shown in the strip at the bottom
          void zyn_embed_envelope(Fl_Window *w, const char *loc)
          {
              if(!w)
                  return;
              if(!g_env) {               // no strip on this screen: normal popup window like before
                  w->show();
                  w->position(Fl::event_x_root() - 20, Fl::event_y_root() + 20);
                  return;
              }
              const int cat = env_category(loc);
              if(w->parent() != g_env) {
                  w->hide();
                  if(w->parent())
                      w->parent()->remove(w);
                  g_env->add(w);
              }
              w->position(g_env->x(), g_env->y());
              g_env_win[cat] = w;
              show_env_category(cat);
          }

          void zyn_env_select(void *key, const char *loc, int mode, Fl_Valuator *a_val, Fl_Valuator *a_dt,
                              Fl_Valuator *d_val, Fl_Valuator *d_dt, Fl_Valuator *s_val, Fl_Valuator *r_val,
                              Fl_Valuator *r_dt)
          {
              if(!key)
                  return;
              if(!g_env || !g_graph) {   // no strip on this screen: open the point editor like before
                  ((EnvelopeUI *)key)->open_as_freemode();
                  return;
              }
              const int cat = env_category(loc);
              EnvSrc &s = g_src[cat];
              s.key = key;
              s.mode = mode;
              s.v[0] = a_val; s.v[1] = a_dt; s.v[2] = d_val; s.v[3] = d_dt;
              s.v[4] = s_val; s.v[5] = r_val; s.v[6] = r_dt;
              s.loc = loc ? loc : "";
              show_graph(cat);
          }

          void zyn_env_forget(void *key)
          {
              for(int i = 0; i < 4; ++i)
                  if(g_src[i].key == key)
                      g_src[i].key = 0;
              if(g_graph)
                  g_graph->redraw();
          }

          // formant filter editor / DynFilter filter window: shown in the FX tab
          void zyn_embed_fx_filter(Fl_Window *w, int kind)
          {
              if(!w)
                  return;
              if(!g_fx) {
                  w->show();
                  return;
              }
              const char *prefix = kind == 0 ? "Formant Filter" : "Filter Parameters";
              for(int i = 0; i < g_fx->children(); ++i) {
                  Fl_Window *k = dynamic_cast<Fl_Window *>(g_fx->child(i));
                  if(k && k != w && k->label() && !strncmp(k->label(), prefix, strlen(prefix)))
                      k->hide();
              }
              if(kind == 0)
                  embed_into(g_fx, w, g_fxp_x, g_fxp_y + 145 + PAD);
              else
                  embed_into(g_fx, w, g_fxp_x + 390 + PAD, g_fxp_y);
              show_page(1);
          }

          // "Panel Window" button: show the PANEL tab (small layout: normal window)
          void zyn_embed_panel(Fl_Window *w)
          {
              if(!w)
                  return;
              if(!g_pages[4]) {
                  w->show();
                  return;
              }
              g_panelw = w;
              show_page(4);
          }

          // "Edit instrument" button of the part panel
          void zyn_goto_engines(Fl_Window *fallback)
          {
              if(g_engine)
                  show_page(0);
              else if(fallback)
                  fallback->show();
          }

          void zyn_embed_engine(Fl_Window *w, int slot)
          {
              if(!w)
                  return;
              if(!g_engine) {            // small screen / classic layout: normal popup window
                  w->show();
                  return;
              }
              if(w->parent() != g_engine) {
                  w->hide();
                  if(w->parent())
                      w->parent()->remove(w);
                  g_engine->add(w);
              }
              themify(w, 0);
              w->position(slot == 1 ? SLOT1_X : PAD, g_engine_y);

              // hide the other engine editors (keep the ADD global window next to the ADD voice window)
              for(int i = 0; i < g_engine->children(); ++i) {
                  Fl_Window *c = dynamic_cast<Fl_Window *>(g_engine->child(i));
                  if(!c || c == w)
                      continue;
                  if(slot == 1 && c->x() == PAD)
                      continue;
                  c->hide();
              }
              w->show();

              int b = (slot == 2) ? 1 : (slot == 3) ? 2 : 0;
              for(int i = 0; i < 3; ++i)
                  if(g_engbtn[i])
                      g_engbtn[i]->value(i == b ? 1 : 0);
              g_engine->redraw();
          }

          // hide every button with this label (the virtual keyboard button is not needed any more)
          static void hide_button(Fl_Group *g, const char *label)
          {
              for(int i = 0; i < g->children(); ++i) {
                  Fl_Widget *c = g->child(i);
                  if(c->label() && !strcmp(c->label(), label))
                      c->hide();
                  else if(Fl_Group *sub = c->as_group())
                      hide_button(sub, label);
              }
          }

          void zyn_unified_shell(MasterUI *ui)
          {
              static bool done = false;
              if(done)
                  return;
              done = true;

              if(getenv("ZYN_CLASSIC_UI"))
                  return;
              if(!ui || !ui->masterwindow || !ui->win_root ||
                 !ui->partuigroup || !ui->syseffectuigroup)
                  return;
              g_ui = ui;

              // pick the layout from the screen size
              bool big = false;
              int sx = 0, sy = 0, sw = 0, sh = 0;
              {
                  Fl::screen_work_area(sx, sy, sw, sh);
                  big = (sw >= 1350 && sh >= 950);
                  const char *force = getenv("ZYN_UI_SIZE");
                  if(force && !strcmp(force, "big"))
                      big = true;
                  if(force && !strcmp(force, "small"))
                      big = false;
                  fprintf(stderr, "[UI] work area %dx%d -> %s layout\n", sw, sh, big ? "BIG" : "SMALL");
              }
              bool envmode = false;
              if(big) {
                  WIN_W = 1366;
                  WIN_H = 912;
                  if(sh >= 1030 && !getenv("ZYN_UI_NOENV")) {            // tall screen (1080p): taller window with a real envelope strip
                      WIN_H = 988;
                      STRIP_H = 184;
                      TAB_H = 36;
                      KB_H = 48;
                      envmode = true;
                  }
              }
              fprintf(stderr, "[UI] envelope strip: %s\n", envmode ? "on" : "off");

              Fl_Window *win = ui->masterwindow;

              Fl_Tabs *fxtabs = 0;
              if(ui->syseffectuigroup->parent() && ui->syseffectuigroup->parent()->parent())
                  fxtabs = dynamic_cast<Fl_Tabs *>(ui->syseffectuigroup->parent()->parent());

              std::vector<Fl_Widget *> master_widgets;
              Fl_Menu_Bar *menu = 0;
              for(int i = 0; i < ui->win_root->children(); ++i) {
                  Fl_Widget *c = ui->win_root->child(i);
                  if(!menu) {
                      if(Fl_Menu_Bar *m = dynamic_cast<Fl_Menu_Bar *>(c)) {
                          menu = m;
                          continue;
                      }
                  }
                  if(c == ui->partuigroup || c == fxtabs)
                      continue;
                  if(c->w() <= 30 && c->h() <= 30 && (!c->label() || !c->label()[0]))
                      continue;
                  master_widgets.push_back(c);
              }

              win->resizable(NULL);
              ui->win_root->resizable(NULL);
              win->size(WIN_W, WIN_H);
              if(sw > 0 && sh > 0) {   // open centered, so the keyboard at the bottom stays on screen
                  int px = sx + (sw - WIN_W) / 2;
                  int py = sy + (sh - WIN_H - 40) / 2;   // ~40 px for the title bar and frame
                  win->position(px < sx ? sx : px, py < sy ? sy : py);
              }
              ui->win_root->resize(0, 0, WIN_W, WIN_H);
              if(menu)
                  menu->resize(0, 0, WIN_W, MENU_H);

              const int bar_y   = MENU_H;
              const int page_y  = MENU_H + TAB_H;
              const int kb_y    = WIN_H - KB_H - PAD;
              const int strip_y = kb_y - STRIP_H - PAD;
              const int page_h  = strip_y - PAD - page_y;
              g_engine_y = page_y + SEL_H + 6;

              win->begin();

              Fl_Box *bar = new Fl_Box(0, bar_y, WIN_W, TAB_H);
              bar->box(FL_FLAT_BOX);
              bar->color(fl_rgb_color(10, 14, 19));

              Fl_Box *logo = new Fl_Box(16, bar_y + 4, 200, TAB_H - 8, "ZYNADDSUBFX");
              logo->box(FL_NO_BOX);
              logo->labelcolor(fl_rgb_color(0, 215, 120));
              logo->labelfont(FL_HELVETICA_BOLD);
              logo->labelsize(18);
              logo->align(FL_ALIGN_LEFT | FL_ALIGN_INSIDE);

              static const char *names[5] = {"ENGINES", "FX", "MATRIX", "GLOBAL", "PANEL"};
              const int ntabs = big ? 5 : 4;
              for(int i = 0; i < ntabs; ++i) {
                  Fl_Button *b = new Fl_Button(250 + i * 116, bar_y + 4, 110, TAB_H - 8, names[i]);
                  b->type(FL_RADIO_BUTTON);
                  b->box(FL_FLAT_BOX);
                  b->down_box(FL_FLAT_BOX);
                  b->color(fl_rgb_color(10, 14, 19));
                  b->selection_color(fl_rgb_color(0, 128, 76));
                  b->labelcolor(fl_rgb_color(215, 240, 230));
                  b->labelfont(FL_HELVETICA_BOLD);
                  b->labelsize(14);
                  b->clear_visible_focus();
                  b->callback(tab_cb, (void *)(intptr_t)i);
                  g_tabs[i] = b;
              }

              for(int i = 0; i < ntabs; ++i)
                  g_pages[i] = make_page(page_y, page_h, (big && (i == 0 || i == 2)) || i == 1 || i == 3 || i == 4);
              g_engine = big ? g_pages[0] : 0;
              g_matrix = big ? g_pages[2] : 0;
              g_matrix_y = page_y + PAD;
              g_global = g_pages[3];
              g_fx = g_pages[1];
              if(big)
                  g_panelw = ui->panelwindow;
              {
                  const char *th = getenv("ZYN_THEME");
                  if(th && !strcmp(th, "classic"))
                      g_theme = false;
              }

              Fl_Box *strip = new Fl_Box(PAD, strip_y, WIN_W - 2 * PAD, STRIP_H,
                                         envmode ? "" : "ENVELOPE EDITOR\nThe envelope graph needs a taller screen - E opens a normal window");
              strip->box(FL_FLAT_BOX);
              strip->color(fl_rgb_color(22, 30, 40));
              strip->labelcolor(fl_rgb_color(143, 167, 176));
              strip->labelsize(12);

              if(envmode) {
                  static const char *envnames[4] = {"AMPLITUDE", "FREQUENCY", "FILTER", "MODULATION"};
                  const int tabh = (STRIP_H - 4) / 4;
                  for(int i = 0; i < 4; ++i) {
                      Fl_Button *b = new Fl_Button(PAD + 4, strip_y + 2 + i * tabh, 104, tabh - 3, envnames[i]);
                      b->type(FL_RADIO_BUTTON);
                      b->box(FL_FLAT_BOX);
                      b->down_box(FL_FLAT_BOX);
                      b->color(fl_rgb_color(14, 18, 24));
                      b->selection_color(fl_rgb_color(0, 128, 76));
                      b->labelcolor(fl_rgb_color(215, 240, 230));
                      b->labelfont(FL_HELVETICA_BOLD);
                      b->labelsize(12);
                      b->clear_visible_focus();
                      b->callback(env_tab_cb, (void *)(intptr_t)i);
                      g_envtab[i] = b;
                  }
                  const int hx = PAD + 112 + 575 + 12;
                  Fl_Box *hint = new Fl_Box(hx, strip_y + 4, WIN_W - PAD - hx - 8, STRIP_H - 8,
