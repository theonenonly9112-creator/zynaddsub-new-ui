          #include <string.h>

          static int zyn_dlg_failed = 0;

          static UINT_PTR CALLBACK zyn_ofn_hook(HWND dlg, UINT msg, WPARAM, LPARAM)
          {
              if(msg == WM_INITDIALOG) {
                  HWND top = GetParent(dlg);
                  if(!top)
                      top = dlg;
                  SetWindowPos(top, HWND_TOPMOST, 0, 0, 0, 0, SWP_NOMOVE | SWP_NOSIZE);
                  SetForegroundWindow(top);
              }
              return 0;
          }

          // pattern looks like "({*.xiz,*.xmz})"; returns the chosen file name or NULL
          static char *zyn_win_dialog(int save, const char *title, const char *pattern)
          {
              static char chosen[1024];
              char exts[256];
              char defext[16];
              int n = 0;
              defext[0] = 0;
              for(const char *p = pattern; p && *p && n < 240; ) {
                  if(p[0] == '*' && p[1] == '.') {
                      if(n)
                          exts[n++] = ';';
                      if(!defext[0]) {
                          int d = 0;
                          for(const char *q = p + 2; *q && *q != ',' && *q != '}' && *q != ')' && d < 14; ++q)
                              defext[d++] = *q;
                          defext[d] = 0;
                      }
                      while(*p && *p != ',' && *p != '}' && *p != ')' && n < 240)
                          exts[n++] = *p++;
                  } else
                      p++;
              }
              exts[n] = 0;
              if(!n)
                  strcpy(exts, "*.*");

              char filter[700];
              int f = 0;
              const char *l1 = "ZynAddSubFX files";
              const char *l2 = "All files";
              const char *a2 = "*.*";
              memcpy(filter + f, l1, strlen(l1) + 1);   f += (int)strlen(l1) + 1;
              memcpy(filter + f, exts, strlen(exts) + 1); f += (int)strlen(exts) + 1;
              memcpy(filter + f, l2, strlen(l2) + 1);   f += (int)strlen(l2) + 1;
              memcpy(filter + f, a2, strlen(a2) + 1);   f += (int)strlen(a2) + 1;
              filter[f++] = 0;

              OPENFILENAMEA ofn;
              memset(&ofn, 0, sizeof(ofn));
              chosen[0] = 0;
              ofn.lStructSize = sizeof(ofn);
              ofn.hwndOwner = NULL;
              ofn.lpstrFilter = filter;
              ofn.nFilterIndex = 1;
              ofn.lpstrFile = chosen;
              ofn.nMaxFile = sizeof(chosen);
              ofn.lpstrTitle = title;
              ofn.lpstrDefExt = defext[0] ? defext : NULL;
              ofn.Flags = OFN_EXPLORER | OFN_HIDEREADONLY | OFN_NOCHANGEDIR | OFN_ENABLEHOOK | OFN_PATHMUSTEXIST
                          | (save ? OFN_OVERWRITEPROMPT : OFN_FILEMUSTEXIST);
              ofn.lpfnHook = zyn_ofn_hook;

              zyn_dlg_failed = 0;
              fprintf(stderr, "[DLG] %s dialog: %s\n", save ? "save" : "open", title ? title : "");
              BOOL ok = save ? GetSaveFileNameA(&ofn) : GetOpenFileNameA(&ofn);
              if(!ok) {
                  DWORD e = CommDlgExtendedError();
                  if(e) {
                      zyn_dlg_failed = 1;
                      fprintf(stderr, "[DLG] dialog failed, error %lu (using the old dialog)\n", (unsigned long)e);
                  } else
                      fprintf(stderr, "[DLG] cancelled\n");
                  return NULL;
              }
              fprintf(stderr, "[DLG] chosen: %s\n", chosen);
              return chosen;
          }
