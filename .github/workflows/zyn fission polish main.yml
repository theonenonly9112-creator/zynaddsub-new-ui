          #pragma once
          // ZYNNM XT: where the user's files live.
          // Order for every folder (Wavetables, Waveforms):
          //   1. the environment variable (ZYNNM_WAVETABLES / ZYNNM_WAVEFORMS) holding the full folder name
          //   2. a folder with that name next to the plugin (or program), made automatically: ZYNNM_HOME\Wavetables
          //   3. %USERPROFILE%\ZYNNM XT\Wavetables   (other systems: $HOME/ZYNNM XT/...)
          #include <string>
          #include <stdlib.h>
          #include <sys/stat.h>
          #ifdef _WIN32
          #include <direct.h>
          #endif

          static inline void zynnm_mkdir(const std::string &p)
          {
          #ifdef _WIN32
              _mkdir(p.c_str());
          #else
              mkdir(p.c_str(), 0755);
          #endif
          }

          static inline bool zynnm_dir_exists(const std::string &p)
          {
              struct stat st;
              return stat(p.c_str(), &st) == 0 && (st.st_mode & S_IFDIR);
          }

          // remember the folder of the plugin / program (path = full name of its file), unless it is known already
          static inline void zynnm_set_home_from_path(const char *path)
          {
              if(!path || (getenv("ZYNNM_HOME") && *getenv("ZYNNM_HOME")))
                  return;
              const std::string s(path);
              const size_t k = s.find_last_of("\\/");
              if(k == std::string::npos)
                  return;
              const std::string e = "ZYNNM_HOME=" + s.substr(0, k);
          #ifdef _WIN32
              _putenv(e.c_str());
          #else
              setenv("ZYNNM_HOME", s.substr(0, k).c_str(), 1);
          #endif
          }

          static inline std::string zynnm_pick_dir(const char *envname, const char *leaf)
          {
              const char *env = getenv(envname);
              if(env && *env) {
                  const std::string d = env;
                  zynnm_mkdir(d);
                  return d;
              }
          #ifdef _WIN32
              const char sep = '\\';
          #else
              const char sep = '/';
          #endif
              const char *zhome = getenv("ZYNNM_HOME");
              if(zhome && *zhome) {
                  const std::string d = std::string(zhome) + sep + leaf;
                  if(!zynnm_dir_exists(d))
                      zynnm_mkdir(d);          // made automatically, right next to the synth
                  if(zynnm_dir_exists(d))
                      return d;                // (when it cannot be made, the user profile is used)
              }
          #ifdef _WIN32
              const char *home = getenv("USERPROFILE");
          #else
              const char *home = getenv("HOME");
          #endif
              std::string base = home ? home : ".";
              base += sep;
              base += "ZYNNM XT";
              zynnm_mkdir(base);
              const std::string d = base + sep + leaf;
              zynnm_mkdir(d);
              return d;
          }

          static inline std::string zynnm_wavetable_dir()
          {
              static std::string dir;
              if(dir.empty())
                  dir = zynnm_pick_dir("ZYNNM_WAVETABLES", "Wavetables");
              return dir;
          }

          // a table is named like "Analog/Acid" (folder/file without .wav): refuse anything that could leave the folder
          static inline bool zynnm_safe_name(const std::string &n)
          {
              if(n.empty() || n.size() > 90)
                  return false;
              if(n[0] == '/' || n[0] == '\\' || n.find("..") != std::string::npos
                 || n.find(':') != std::string::npos || n.find('\\') != std::string::npos)
                  return false;
              return true;
          }
          HEOF
