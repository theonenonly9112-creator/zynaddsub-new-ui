          sub1(O, '        if(func)\n            smps[i] = func(t, par);\n        else if (Pcurrentbasefunc == 0)',
               '        if(Pcurrentbasefunc == ZYNNM_TABLE_FUNC)\n            smps[i] = wt ? zynWtSample(wt, t, tablepos, synth.oscilsize)\n                         : -sinf(2.0f * PI * i / synth.oscilsize);   // no table loaded: sine\n        else if(func)\n            smps[i] = func(t, par);\n        else if (Pcurrentbasefunc == 0)')
          # copy / paste
          sub1(O, '    COPY(Pcurrentbasefunc);\n    COPY(Pbasefuncpar);\n', '    COPY(Pcurrentbasefunc);\n    COPY(Pbasefuncpar);\n    memcpy(this->Pwavetable, o.Pwavetable, sizeof(Pwavetable));\n    this->wt = o.wt;\n')
