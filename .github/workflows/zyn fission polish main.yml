                          if(names[i] == pending)
                              list->select((int)i + 1);
                      pending.clear();
                  }
                  char msg[400];
                  if(names.empty())
                      snprintf(msg, sizeof(msg), "Nothing saved yet. Shape the harmonics, type a name and press Save.");
                  else
                      snprintf(msg, sizeof(msg), "%d saved. Click one to load it.\n%s", (int)names.size(), dir.c_str());
                  info->copy_label(msg);
                  redraw();
              }

          private:
              Fl_Button *mkbutton(int X, int Y, int W, int H, const char *label)
              {
                  Fl_Button *b = new Fl_Button(X, Y, W, H, label);
                  b->box(FL_FLAT_BOX);
                  b->down_box(FL_FLAT_BOX);
                  b->color(fl_rgb_color(22, 30, 40));
                  b->selection_color(fl_rgb_color(0, 128, 76));
                  b->labelcolor(fl_rgb_color(215, 240, 230));
                  b->labelfont(FL_HELVETICA_BOLD);
                  b->clear_visible_focus();
                  return b;
              }

              static bool less_nocase(const std::string &a, const std::string &b)
              {
                  const size_t n = a.size() < b.size() ? a.size() : b.size();
                  for(size_t i = 0; i < n; ++i) {
                      const int x = tolower((unsigned char)a[i]), y = tolower((unsigned char)b[i]);
                      if(x != y)
                          return x < y;
                  }
                  return a.size() < b.size();
              }

              static bool same_tail(const std::string &n, const char *tail)
              {
                  const size_t t = strlen(tail);
                  for(size_t i = 0; i < t; ++i)
                      if(tolower((unsigned char)n[n.size() - t + i]) != tolower((unsigned char)tail[i]))
                          return false;
                  return true;
              }

              void later()   // the synth writes or deletes the file a moment after the message: look again then
              {
                  Fl::remove_timeout(timer_cb, this);
                  Fl::add_timeout(0.7, timer_cb, this);
              }

              void save()
              {
                  std::string n = nameinput->value() ? nameinput->value() : "";
                  for(size_t i = 0; i < n.size(); ++i)
                      if(strchr("\\/:*?\"<>|", n[i]))
                          n[i] = '_';
                  while(!n.empty() && n[0] == ' ')
                      n.erase(0, 1);
                  while(!n.empty() && n[n.size() - 1] == ' ')
                      n.erase(n.size() - 1);
                  if(n.empty()) {
                      info->copy_label("Type a name first, then press Save.");
                      redraw();
                      return;
                  }
                  osc->write("/presets/copy", "ss", loc.c_str(), n.c_str());
                  pending = n;
                  later();
              }

              void remove()
              {
                  const int v = list->value();
                  if(v < 1 || v > (int)names.size())
                      return;
                  if(fl_choice("Delete \"%s\"?", "Cancel", "Delete", 0, names[v - 1].c_str()) != 1)
                      return;
                  osc->write("/presets/delete", "s", (zynnm_waveform_dir() + "/" + names[v - 1] + ".zwav").c_str());
                  later();
              }

              void picked()
              {
                  const int v = list->value();
                  if(v < 1 || v > (int)names.size() || !osc)
                      return;
                  osc->write("/presets/paste", "ss", loc.c_str(),
                             (zynnm_waveform_dir() + "/" + names[v - 1] + ".zwav").c_str());
                  nameinput->value(names[v - 1].c_str());   // so Save writes over it
                  do_callback();                            // the oscillator editor refreshes its display
              }

              static void list_cb(Fl_Widget *, void *d) { ((HarmonicPanel *)d)->picked(); }
              static void save_cb(Fl_Widget *, void *d) { ((HarmonicPanel *)d)->save(); }
              static void del_cb(Fl_Widget *, void *d) { ((HarmonicPanel *)d)->remove(); }
              static void timer_cb(void *d) { ((HarmonicPanel *)d)->scan(); }

              Fl_Osc_Interface        *osc;
              std::string              loc;
              std::string              pending;
              std::vector<std::string> names;
              Fl_Box                  *title;
              Fl_Box                  *info;
              Fl_Box                  *namelabel;
              Fl_Input                *nameinput;
              Fl_Hold_Browser         *list;
              Fl_Button               *savebtn;
              Fl_Button               *delbtn;
          };
