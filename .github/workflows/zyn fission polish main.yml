          cat > src/UI/ZynFont.cpp <<'FONTEOF'
          // ZynFont.cpp - one UI font for the whole window.
          // Default: Segoe UI (always present on Windows Vista/7).
          // Change it with a file "zyn-font.txt" next to the exe/plugin (first line = font family name,
          // e.g. Calibri, Tahoma, Trebuchet MS), or the environment variable ZYN_FONT.
          // Put "classic" in the file to keep the old font.
          // A font file named "zyn-font.ttf" next to the exe/plugin is loaded for this program only;
          // put its family name in zyn-font.txt.
          #include <FL/Fl.H>
          #include <FL/fl_draw.H>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #ifdef _WIN32
          #include <windows.h>
          #endif

          void zyn_apply_font(void)
          {
              static char family[128] = "Segoe UI";
              static char name_regular[160];
              static char name_bold[160];
          #ifdef _WIN32
              char dir[MAX_PATH];
              dir[0] = '\0';
              if(GetModuleFileNameA(NULL, dir, MAX_PATH)) {
                  char *slash = strrchr(dir, '\\');
                  if(slash)
                      slash[1] = '\0';
                  else
                      dir[0] = '\0';
              }

              char path[MAX_PATH + 32];
              snprintf(path, sizeof(path), "%szyn-font.ttf", dir);
              if(GetFileAttributesA(path) != INVALID_FILE_ATTRIBUTES)
                  AddFontResourceExA(path, FR_PRIVATE, 0);

              snprintf(path, sizeof(path), "%szyn-font.txt", dir);
              if(FILE *f = fopen(path, "r")) {
                  char line[128];
                  if(fgets(line, sizeof(line), f)) {
                      size_t n = strlen(line);
                      while(n && (line[n - 1] == '\n' || line[n - 1] == '\r' || line[n - 1] == ' '))
                          line[--n] = '\0';
                      if(n)
                          snprintf(family, sizeof(family), "%s", line);
                  }
                  fclose(f);
              }
          #endif
              const char *env = getenv("ZYN_FONT");
              if(env && env[0])
                  snprintf(family, sizeof(family), "%s", env);
              if(!strcmp(family, "classic"))
                  return;

              // FLTK font names start with a style letter: ' ' regular, 'B' bold
              snprintf(name_regular, sizeof(name_regular), " %s", family);
              snprintf(name_bold, sizeof(name_bold), "B%s", family);
              Fl::set_font(FL_HELVETICA, name_regular);
              Fl::set_font(FL_HELVETICA_BOLD, name_bold);
              fprintf(stderr, "[UI] font: %s\n", family);
          }
          FONTEOF
          cat > /tmp/newdraw.txt <<'DRAWEOF'
          void WidgetPDial::draw()
          {
          #ifdef NTK_GUI
              box( FL_NO_BOX );

              Fl_Dial::draw();

              return;
          #else
              const int cx = x(), cy = y(), sx = w(), sy = h();
              const double a1 = angle1(), a2 = angle2();
              const double val = (value() - minimum()) / (maximum() - minimum());
              // even radius produces less artifacts if no antialiasing is avail
              const int rad = (sx > sy ? sy : sx) &~1;

              /* dark body with a thin light rim (flat, like the mockup) */
              pdialcolor(6, 9, 13);
              fl_pie(cx - 1, cy - 1, rad + 2, rad + 2, 0, 360);
              pdialcolor(44, 56, 70);
              fl_pie(cx, cy, rad, rad, 0, 360);
              if (rad > 6) {
                  pdialcolor(26, 34, 44);
                  fl_pie(cx + 2, cy + 2, rad - 4, rad - 4, 0, 360);
              }
              if (rad > 14) {
                  pdialcolor(18, 24, 32);
                  fl_pie(cx + rad / 4, cy + rad / 4, rad - rad / 2, rad - rad / 2, 0, 360);
              }

              /* full range track, then the value arc on top of it */
              const double a = -(a2 - a1) * val - a1;
              fl_line_style(FL_SOLID, rad >= 24 ? 3 : 2, 0);
              pdialcolor(52, 64, 78);
              fl_arc(cx + 2, cy + 2, rad - 4, rad - 4, -a2 - 90, a1 - 180);
              pdialcolor(0, 215, 120);
              fl_arc(cx + 2, cy + 2, rad - 4, rad - 4, a - 90, a1 - 180);

              /* pointer */
              const double t = (a - 90.0) * 3.14159265358979 / 180.0;
              const double dx = cos(t), dy = -sin(t);
              const double r1 = rad * 0.16, r2 = rad * 0.34;
              fl_line_style(FL_SOLID, 2, 0);
              pdialcolor(225, 245, 255);
              fl_line(cx + rad / 2 + (int)(dx * r1 + 0.5), cy + rad / 2 + (int)(dy * r1 + 0.5),
                      cx + rad / 2 + (int)(dx * r2 + 0.5), cy + rad / 2 + (int)(dy * r2 + 0.5));
              fl_line_style(0);
          #endif
          }
