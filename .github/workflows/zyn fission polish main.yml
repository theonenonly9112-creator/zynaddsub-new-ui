              }

              static bool strcasecmp_tail(const std::string &n, const char *tail)
              {
                  const size_t t = strlen(tail);
                  for(size_t i = 0; i < t; ++i)
                      if(tolower((unsigned char)n[n.size() - t + i]) != tolower((unsigned char)tail[i]))
                          return true;     // differs
