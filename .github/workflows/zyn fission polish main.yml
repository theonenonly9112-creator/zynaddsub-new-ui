          sub1(P, 'static std::string zwavDir()\n{\n    static std::string dir;\n    if(!dir.empty())\n        return dir;\n',
               'static std::string zwavDir()\n{\n    static std::string dir;\n    if(!dir.empty())\n        return dir;\n'
               '    dir = zynnm_pick_dir("ZYNNM_WAVEFORMS", "Waveforms");   // see zyn_paths.h\n    return dir;\n')

          # the plugin tells the engine and the editor where it lives
          V = 'DPF/distrho/src/DistrhoPluginVST.cpp'
