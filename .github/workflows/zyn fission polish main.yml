              // GLOBAL: master controls keep their arrangement
              for(size_t i = 0; i < master_widgets.size(); ++i) {
                  Fl_Widget *w = master_widgets[i];
                  g_pages[3]->add(w);
                  w->position(w->x() + PAD, w->y() - MENU_H + page_y + PAD);
              }

              // dark theme for the widgets that were moved
              themify(ui->partuigroup, 1);
              if(fxtabs)
                  themify(fxtabs, 1);
              for(size_t i = 0; i < master_widgets.size(); ++i)
                  themify(master_widgets[i], 1);

              // the old "Edit instrument" button is replaced by the ENGINES / MATRIX tabs
              if(big)
                  if(Fl_Widget *eb = find_by_label(ui->partuigroup, "Edit instrument"))
                      eb->hide();

              // controllers (portamento ...) and the part effects are shown permanently
