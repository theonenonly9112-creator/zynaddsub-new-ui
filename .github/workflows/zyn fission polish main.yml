                  if(ui->partui->partfx)
                      zyn_embed_fx(ui->partui->partfx);
              }

              if(big)
                  Fl::add_timeout(0.3, sync_cb);

              hide_button(win, "vK");
              show_page(0);
              win->redraw();
          }
