          class WavetablePanel : public Fl_Group
          {
          public:
              WavetablePanel(int X, int Y, int W, int H, Fl_Osc_Interface *osc_, const std::string &loc_)
                  : Fl_Group(X, Y, W, H), osc(osc_), loc(loc_)
              {
                  box(FL_FLAT_BOX);
                  color(fl_rgb_color(26, 34, 44));
                  title = new Fl_Box(X + 6, Y + 6, W - 12, 22, "WAVETABLES");
                  title->box(FL_NO_BOX);
