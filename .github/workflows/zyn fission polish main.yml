                      std::vector<std::string> subs;
                      while((e = readdir(d))) {
                          const std::string n = e->d_name;
                          if(n == "." || n == "..")
                              continue;
                          struct stat st;
                          if(stat((root + "/" + n).c_str(), &st) == 0 && S_ISDIR(st.st_mode))
                              subs.push_back(n);
                      }
                      closedir(d);
                      std::sort(subs.begin(), subs.end(), less_nocase);
                      for(size_t i = 0; i < subs.size(); ++i)
