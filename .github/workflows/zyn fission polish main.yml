          sub1(O, '    xml.addpar("base_function_par", Pbasefuncpar);\n', '    xml.addpar("base_function_par", Pbasefuncpar);\n    if(Pwavetable[0])\n        xml.addparstr("wavetable", Pwavetable);\n')
