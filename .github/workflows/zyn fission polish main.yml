               'int main(int argc, char *argv[])\n{\n    if(argc > 0)\n        zynnm_set_home_from_path(argv[0]);\n#ifdef WIN32\n    SetUnhandledExceptionFilter(zyn_crash_handler);\n    zyn_open_log("zyn-gui-log.txt");')
          sub1('src/main.cpp', '#include <iostream>\n', '#include <iostream>\n#include "zyn_paths.h"\n')
