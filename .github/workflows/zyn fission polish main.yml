          echo "ninja exit code: $STATUS"
          exit $STATUS
      - name: Single-file plugin for LMMS and FL (static link, optional)
        run: |
          set +e
          # zlib built as a static library of our own, so the plugin can never ask for libz-1.dll
          (cd $HOME && curl -fLO https://zlib.net/fossils/zlib-1.3.1.tar.gz && tar xzf zlib-1.3.1.tar.gz \
            && cd zlib-1.3.1 && ./configure --static --prefix=$HOME/zstatic && make -j4 && make install)
          ls -la $HOME/zstatic/lib/libz.a
          cd zynaddsubfx-3.0.3
          mkdir -p ../stash
          # The first static try still needed libz-1.dll: CMake picks the import library (libz.dll.a) before the
          # static one (libz.a). So hide every import library that has a static twin, and configure a fresh
          # build folder so that the library paths are found again.
          for f in /mingw32/lib/lib*.dll.a; do
            [ -f "$f" ] || continue
            if [ -f "${f%.dll.a}.a" ]; then mv "$f" "$f.off"; echo "hidden: $f"; fi
          done
          mkdir build-static && cd build-static
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_CXX_FLAGS="-include cstdint -g -fno-omit-frame-pointer -mstackrealign -D_WIN32_WINNT=0x0601 -DWINVER=0x0601" \
            -DCMAKE_C_FLAGS="-g -fno-omit-frame-pointer -mstackrealign -D_WIN32_WINNT=0x0601 -DWINVER=0x0601" \
            -DCMAKE_SHARED_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
            -DCMAKE_CXX_STANDARD_LIBRARIES="-lws2_32 -liphlpapi -lwinmm -lole32 -luuid -lsetupapi" \
            -DZLIB_LIBRARY=$HOME/zstatic/lib/libz.a -DZLIB_INCLUDE_DIR=$HOME/zstatic/include \
            -DGuiModule=fltk -DPaEnable=ON \
            -DJackEnable=OFF -DAlsaEnable=OFF -DOssEnable=OFF > ../../cmake-static.log 2>&1
          ninja ZynAddSubFX_vst > ../../build-static.log 2>&1
          STATUS=$?
          # give the import libraries back
          for f in /mingw32/lib/lib*.dll.a.off; do [ -f "$f" ] && mv "$f" "${f%.off}"; done
          echo "================ STATIC PLUGIN: LAST 15 LINES ================"
          tail -n 15 ../../build-static.log
          grep -n -E "error:|undefined reference|cannot find" ../../build-static.log | head -20
          SDLL=$(find . -name ZynAddSubFX.dll | head -n 1)
          if [ $STATUS -eq 0 ] && [ -n "$SDLL" ]; then
            cp "$SDLL" ../../stash/ZynAddSubFX-static.dll
            echo "===== files the single-file plugin still needs ====="
            objdump -p ../../stash/ZynAddSubFX-static.dll | grep "DLL Name"
            objdump -p ../../stash/ZynAddSubFX-static.dll | grep -q "libz-1.dll" && echo "!!!!! STILL NEEDS libz-1.dll !!!!!"
          fi
          exit 0

      - name: Collect files
        run: |
          mkdir -p out
          # copy every non-system DLL a file needs (and what those DLLs need)
          copydeps() {
            local file="$1" dest="$2"
            for dll in $(objdump -p "$file" | grep "DLL Name" | awk '{print $3}'); do
              if [ -f "/mingw32/bin/$dll" ] && [ ! -f "$dest/$dll" ]; then
                cp "/mingw32/bin/$dll" "$dest/"
                echo "bundled $dll"
                copydeps "/mingw32/bin/$dll" "$dest"
              fi
            done
          }
          EXE=$(find zynaddsubfx-3.0.3/build -name zynaddsubfx.exe | head -n 1)
          cp "$EXE" out/
          copydeps out/zynaddsubfx.exe out
          VST=$(find zynaddsubfx-3.0.3/build -name ZynAddSubFX.dll | head -n 1)
          if [ -n "$VST" ]; then
            mkdir -p out/vst
            cp "$VST" out/vst/
            copydeps out/vst/ZynAddSubFX.dll out/vst
          fi
          GUIEXE=$(find zynaddsubfx-3.0.3/build -name zynaddsubfx-ext-gui.exe | head -n 1)
          if [ -n "$VST" ] && [ -n "$GUIEXE" ]; then
            cp "$GUIEXE" out/vst/
            copydeps out/vst/zynaddsubfx-ext-gui.exe out/vst
          fi
          if [ -f stash/ZynAddSubFX-static.dll ]; then
            mkdir -p out/vst-lmms
            cp stash/ZynAddSubFX-static.dll "out/vst-lmms/ZYNNM XT.dll"
            if [ -n "$GUIEXE" ]; then
              cp "$GUIEXE" out/vst-lmms/ZYNNM-XT-editor.exe
              copydeps out/vst-lmms/ZYNNM-XT-editor.exe out/vst-lmms
            fi
            strip --strip-debug "out/vst-lmms/ZYNNM XT.dll" 2>/dev/null || true
          fi
          cp -r zynaddsubfx-3.0.3/instruments out/ || true
          cp -r zynaddsubfx-3.0.3/pixmaps out/ || true
          # keep unstripped copies for addr2line; shipped files keep their symbol table so crash logs show function names
          mkdir -p debug
          cp out/zynaddsubfx.exe debug/ 2>/dev/null || true
          cp out/vst/ZynAddSubFX.dll debug/ 2>/dev/null || true
          cp out/vst/zynaddsubfx-ext-gui.exe debug/ 2>/dev/null || true
          strip --strip-debug out/zynaddsubfx.exe 2>/dev/null || true
          strip --strip-debug out/vst/ZynAddSubFX.dll 2>/dev/null || true
          strip --strip-debug out/vst/zynaddsubfx-ext-gui.exe 2>/dev/null || true
          (cd debug && zip -r ../zyn-debug-symbols.zip . ) || true
          echo "===== FILES IN ZIP ====="
          ls -R out | head -n 60
          # every exe and dll in every folder must find its DLLs next to it (the single-file plugin was never checked)
          echo "===== dependency table (every DLL each file imports) ====="
          for f in out/*.exe out/vst/*.exe out/vst/*.dll out/vst-lmms/*.exe out/vst-lmms/*.dll; do
            [ -f "$f" ] || continue
            echo "-- $f"
            for dll in $(objdump -p "$f" | grep "DLL Name" | awk '{print $3}'); do
              if [ -f "$(dirname "$f")/$dll" ]; then st="next to it";
              elif [ -f "/mingw32/bin/$dll" ]; then st="IN MINGW BIN BUT NOT COPIED";
              else st="system or NOT FOUND"; fi
              echo "   $dll : $st"
            done
          done
          echo "===== dependency check ====="
          for f in out/*.exe out/vst/*.exe out/vst/*.dll out/vst-lmms/*.exe out/vst-lmms/*.dll; do
            [ -f "$f" ] || continue
            d=$(dirname "$f")
            for dll in $(objdump -p "$f" | grep "DLL Name" | awk '{print $3}'); do
              if [ ! -f "$d/$dll" ] && [ -f "/mingw32/bin/$dll" ]; then
                echo "was missing next to $f: $dll (bundled now)"
                copydeps "$f" "$d"
              fi
            done
          done
          mv out/zynaddsubfx.exe "out/ZYNNM XT.exe"
          if [ -f out/vst/ZynAddSubFX.dll ]; then mv out/vst/ZynAddSubFX.dll "out/vst/ZYNNM XT.dll"; fi
          if [ -f out/vst/zynaddsubfx-ext-gui.exe ]; then mv out/vst/zynaddsubfx-ext-gui.exe out/vst/ZYNNM-XT-editor.exe; fi
          {
            echo "== zlib files"; ls -la $HOME/zstatic/lib/libz.a /mingw32/lib/libz* /mingw32/bin/*z*.dll 2>&1
            echo "== static plugin imports"; objdump -p stash/ZynAddSubFX-static.dll 2>&1 | grep "DLL Name"
            echo "== static build, last lines"; tail -n 30 build-static.log 2>&1
            echo "== zlib in cmake cache"; grep -i zlib zynaddsubfx-3.0.3/build-static/CMakeCache.txt 2>&1
          } > out/diagnostics.txt 2>&1
          # one plugin folder for every host: the single-file (static) plugin replaces the dynamic one
          if [ -f "out/vst-lmms/ZYNNM XT.dll" ]; then
            rm -rf out/vst
            mv out/vst-lmms out/vst
            echo "plugin folder out/vst now holds the single-file plugin"
          else
            echo "WARNING: the single-file plugin was not built, out/vst holds the dynamic plugin (needs its DLLs)"
          fi
          # zlib next to the plugin, in case it is still imported (this fixed FL Studio)
          [ -f /mingw32/bin/libz-1.dll ] && cp -n /mingw32/bin/libz-1.dll out/vst/
          cd out && zip -r ../ZYNNM-XT-win32.zip .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZYNNM-XT-win32
          path: ZYNNM-XT-win32.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zyn-debug-symbols
          path: zyn-debug-symbols.zip
          if-no-files-found: ignore
