          patch('src/crashreport.h', '/* write everything the program prints', HOOKS + '/* write everything the program prints')
          patch('src/main.cpp', 'zyn_open_log("zyn-log.txt");', 'zyn_open_log("zyn-log.txt");\n    zyn_install_abort_hooks();')
