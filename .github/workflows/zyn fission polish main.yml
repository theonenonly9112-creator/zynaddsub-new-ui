              void add_dir(const std::string &dir, const std::string &prefix)
              {
                  DIR *d = opendir(dir.c_str());
                  if(!d)
                      return;
                  std::vector<std::string> found;
                  struct dirent *e;
                  while((e = readdir(d))) {
                      const std::string n = e->d_name;
