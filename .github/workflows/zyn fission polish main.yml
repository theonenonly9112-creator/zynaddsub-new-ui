                          *edit = 0;
                          d.reply("/damage", "s", repath);
                      } else
                          d.reply(d.loc, "s", o->Pwavetable);
                  }},
              {"use-as-base:", rProp(non-realtime)''')

          # the wavetable loader and reader, before the constructor
          sub1(O, 'OscilGen::OscilGen(const SYNTH_T &synth_, FFTwrapper *fft_, Resonance *res_)\n',
               r'''// ---- ZYNNM XT wavetables --------------------------------------------------------------------------
          // A table is a .wav file (Serum style: frames of 2048 samples one after the other, 16/24/32 bit or float).
          // Loaded tables stay in memory for good, so the audio thread can read them without any lock.
          #define ZYNNM_TABLE_FUNC 24

          struct ZynWaveTable
          {
              std::vector<float> data;    // frames * framesize samples
              int                framesize;
              int                frames;
          };

          static unsigned zynRd32(const unsigned char *p)
          {
              return (unsigned)p[0] | ((unsigned)p[1] << 8) | ((unsigned)p[2] << 16) | ((unsigned)p[3] << 24);
          }

          static unsigned zynRd16(const unsigned char *p)
          {
              return (unsigned)p[0] | ((unsigned)p[1] << 8);
          }

          static std::map<std::string, ZynWaveTable *> &zynWtCache()
          {
              static std::map<std::string, ZynWaveTable *> cache;
              return cache;
          }

          static ZynWaveTable *zynLoadWaveTable(const std::string &name)
          {
              static size_t total = 0;
              if(!zynnm_safe_name(name))
                  return NULL;
              std::map<std::string, ZynWaveTable *> &cache = zynWtCache();
              std::map<std::string, ZynWaveTable *>::iterator it = cache.find(name);
              if(it != cache.end())
                  return it->second;

              const std::string path = zynnm_wavetable_dir() + "/" + name + ".wav";
              FILE *f = fopen(path.c_str(), "rb");
              if(!f)
                  return NULL;
              fseek(f, 0, SEEK_END);
              const long len = ftell(f);
              fseek(f, 0, SEEK_SET);
              if(len < 44 || len > 48 * 1024 * 1024) {
                  fclose(f);
                  return NULL;
              }
              std::vector<unsigned char> buf((size_t)len);
              const size_t got = fread(&buf[0], 1, (size_t)len, f);
              fclose(f);
              if(got != (size_t)len || memcmp(&buf[0], "RIFF", 4) || memcmp(&buf[8], "WAVE", 4))
                  return NULL;

              int    fmt = 0, chans = 1, bits = 16, clmsize = 0;
              size_t dataoff = 0, datalen = 0;
              size_t p = 12;
              while(p + 8 <= (size_t)len) {
                  size_t sz = zynRd32(&buf[p + 4]);
                  const size_t avail = (size_t)len - (p + 8);
                  if(sz > avail)
                      sz = avail;     // cut-off file
                  const unsigned char *c = &buf[p + 8];
                  if(!memcmp(&buf[p], "fmt ", 4) && sz >= 16) {
                      fmt   = (int)zynRd16(c);
                      chans = (int)zynRd16(c + 2);
                      bits  = (int)zynRd16(c + 14);
                      if(fmt == 0xFFFE && sz >= 26)
                          fmt = (int)zynRd16(c + 24);     // extensible: the real format comes from the sub-format
                  } else if(!memcmp(&buf[p], "clm ", 4) && sz >= 4 && !memcmp(c, "<!>", 3)) {
                      char num[12];
                      size_t k = 0;
                      while(k < 10 && 3 + k < sz && c[3 + k] >= '0' && c[3 + k] <= '9') {
                          num[k] = (char)c[3 + k];
                          ++k;
                      }
                      num[k]  = 0;
                      clmsize = atoi(num);        // Serum tells the frame size here
                  } else if(!memcmp(&buf[p], "data", 4)) {
                      dataoff = p + 8;
                      datalen = sz;
                  }
                  p += 8 + sz + (sz & 1);
              }
              if(!dataoff || chans < 1 || bits < 8 || (bits & 7))
                  return NULL;
              const bool isfloat = (fmt == 3);
              if(!(fmt == 1 || isfloat) || (isfloat && bits != 32 && bits != 64))
                  return NULL;
              const size_t bps   = (size_t)bits / 8;
              const size_t block = bps * (size_t)chans;
              const size_t count = datalen / block;
              if(count < 8)
                  return NULL;

              std::vector<float> mono(count);
              for(size_t i = 0; i < count; ++i) {
                  const unsigned char *s = &buf[dataoff + i * block];   // first channel only
                  float v = 0.0f;
                  if(isfloat) {
                      if(bits == 32) {
                          float x;
                          memcpy(&x, s, 4);
                          v = x;
                      } else {
                          double x;
                          memcpy(&x, s, 8);
                          v = (float)x;
                      }
                  } else if(bits == 8)
                      v = ((int)s[0] - 128) / 128.0f;
                  else if(bits == 16)
                      v = (short)zynRd16(s) / 32768.0f;
                  else if(bits == 24)
                      v = (int)((zynRd32(s) << 8) & 0xFFFFFF00u) / 2147483648.0f;
                  else if(bits == 32)
                      v = (int)zynRd32(s) / 2147483648.0f;
                  else
                      return NULL;
                  if(!(v == v))
                      v = 0.0f;       // NaN
                  mono[i] = v;
              }

              int framesize = (clmsize >= 32 && clmsize <= 65536) ? clmsize : 2048;
              if((size_t)framesize > count)
                  framesize = (int)count;
              const int frames = (int)(count / (size_t)framesize);
              if(frames < 1 || total + (size_t)frames * (size_t)framesize * 4 > 256u * 1024u * 1024u)
                  return NULL;

              ZynWaveTable *t = new ZynWaveTable;
              t->framesize = framesize;
              t->frames    = frames;
              t->data.assign(mono.begin(), mono.begin() + (size_t)frames * (size_t)framesize);
              total += (size_t)frames * (size_t)framesize * 4;
              cache[name] = t;
              return t;
          }

          // one sample of the table: x = position in the cycle (0..1), pos = position in the table (0..1)
          static float zynWtSample(const ZynWaveTable *t, float x, float pos, int oscilsize)
          {
              const int   fs   = t->framesize;
              const float fpos = pos * (float)(t->frames - 1);
              int f0 = (int)fpos;
              if(f0 > t->frames - 1)
                  f0 = t->frames - 1;
              const int   f1 = (f0 + 1 < t->frames) ? f0 + 1 : f0;
              const float fr = fpos - (float)f0;
              const float *a = &t->data[(size_t)f0 * (size_t)fs];
              const float *b = &t->data[(size_t)f1 * (size_t)fs];

              const float idx = x * (float)fs;
              const int   i0  = (int)idx;
              int box = fs / oscilsize;       // frame has more samples than the oscillator: average them
              if(box < 1)
                  box = 1;
              float va = 0.0f, vb = 0.0f;
              if(box == 1) {
                  const float k  = idx - (float)i0;
                  const int   ia = i0 % fs, ib = (i0 + 1) % fs;
                  va = a[ia] + (a[ib] - a[ia]) * k;
                  vb = b[ia] + (b[ib] - b[ia]) * k;
              } else {
                  const int start = i0 - box / 2;
                  for(int j = 0; j < box; ++j) {
                      const int ii = ((start + j) % fs + fs) % fs;
                      va += a[ii];
                      vb += b[ii];
                  }
                  va /= (float)box;
                  vb /= (float)box;
              }
              return va + (vb - va) * fr;
          }

          bool OscilGen::setwavetable(const char *name)
          {
              char tmp[sizeof(Pwavetable)];
              tmp[0] = 0;
              if(name) {
                  strncpy(tmp, name, sizeof(tmp) - 1);
                  tmp[sizeof(tmp) - 1] = 0;
              }
              memcpy(Pwavetable, tmp, sizeof(Pwavetable));
              wt = tmp[0] ? zynLoadWaveTable(tmp) : NULL;
              oldbasefunc     = 255;       // makes prepare() build the base function again
              cachedbasevalid = false;
              return wt != NULL;
          }

          OscilGen::OscilGen(const SYNTH_T &synth_, FFTwrapper *fft_, Resonance *res_)
          ''')
