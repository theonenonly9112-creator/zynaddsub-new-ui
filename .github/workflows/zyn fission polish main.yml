                  refreshbtn->box(FL_FLAT_BOX);
                  refreshbtn->down_box(FL_FLAT_BOX);
                  refreshbtn->color(fl_rgb_color(22, 30, 40));
                  refreshbtn->selection_color(fl_rgb_color(0, 128, 76));
                  refreshbtn->labelcolor(fl_rgb_color(215, 240, 230));
                  refreshbtn->labelfont(FL_HELVETICA_BOLD);
                  refreshbtn->clear_visible_focus();
                  refreshbtn->callback(refresh_cb, this);

                  info = new Fl_Box(X + 6, Y + H - 96, W - 12, 32, "");
