                      OscilGen *o = (OscilGen*)d.obj;
                      if(rtosc_narguments(msg)) {
                          if(o->setwavetable(rtosc_argument(msg, 0).s)) {
                              o->Pcurrentbasefunc = 24;   // choosing a table selects the Table base waveform
                              o->Pbasefuncpar     = 0;    // starting at its first frame
                          }
